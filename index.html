<!-- PARTE 1: ESTRUTURA E DESIGN -->
<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arka Elegancy | Interface</title>
    <style>
        /* Estilos CSS: Embeleza e organiza visualmente a estrutura */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        .promo-bar { background: #000; color: #fff; text-align: center; padding: 8px; font-size: 11px; }
        .logo { font-size: 24px; font-weight: bold; text-align: center; padding: 20px; }
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 20px; }
        .product-card { border: 1px solid #ddd; padding: 10px; cursor: pointer; }
        /* Estilo da Lupa */
        .zoom-modal { display: none; position: fixed; top: 0; background: rgba(0,0,0,0.9); width: 100%; height: 100%; justify-content: center; align-items: center; z-index: 1000; }
        .zoom-viewer { width: 400px; height: 400px; background-size: 250%; background-position: center; border: 2px solid white; }
    </style>
</head>
<body>
    <div class="promo-bar">ARKA ELEGANCY - PREÇOS EM MT</div>
    <div class="logo">Arka Elegancy</div>
    
    <section class="product-grid">
        <!-- O HTML fornece a estrutura base dos produtos -->
        <div class="product-card" onclick="ativarLupa('url_da_imagem.jpg', 'Vestido Silk')">
            <p>Vestido Silk - 2.500 MT</p>
        </div>
    </section>

    <div id="zoomModal" class="zoom-modal" onclick="this.style.display='none'">
        <div id="zoomViewer" class="zoom-viewer"></div>
    </div>
<!-- PARTE 2: LÓGICA E INTERATIVIDADE -->
    <script>
        /* JavaScript: Adiciona interatividade e dinamismo ao site */
        function ativarLupa(imgUrl, nome) {
            const modal = document.getElementById('zoomModal');
            const viewer = document.getElementById('zoomViewer');
            modal.style.display = 'flex';
            viewer.style.backgroundImage = `url(${imgUrl})`;
            
            viewer.onmousemove = function(e) {
                const posX = (e.offsetX / viewer.offsetWidth) * 100;
                const posY = (e.offsetY / viewer.offsetHeight) * 100;
                viewer.style.backgroundPosition = `${posX}% ${posY}%`;
            };
        }
    </script>
</body>
</html>
