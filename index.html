<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arka Elegancy | Luxo e Sofisticação</title>
    <style>
        /* CONFIGURAÇÕES GERAIS E CORES */
        :root {
            --preto-profundo: #0a0a0a;
            --preto-card: #141414;
            --dourado-luxo: #D4AF37;
            --branco-puro: #ffffff;
            --cor-whatsapp: #25d366;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Playfair Display', serif; }
        body { background-color: var(--preto-profundo); color: var(--branco-puro); line-height: 1.6; }

        /* CABEÇALHO E MARCA */
        .promo-bar { background: var(--dourado-luxo); color: #000; text-align: center; padding: 10px; font-size: 11px; font-weight: bold; }
        header { 
            background: rgba(20, 20, 20, 0.98); 
            position: sticky; top: 0; z-index: 1000; 
            border-bottom: 1px solid var(--dourado-luxo); 
            padding: 15px 5%; display: flex; justify-content: space-between; 
        }
        
        .logo { 
            font-size: 28px; font-weight: 900; text-transform: uppercase;
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* VITRINE DE PRODUTOS (Resumo) */
        .container { max-width: 1200, margin: 0 auto; padding: 20px; }
        .titulo-secao { text-align: center; margin: 50px 0 30px; color: var(--dourado-luxo); text-transform: uppercase; }
        .grade-produtos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .cartao-produto { background: var(--preto-card); border: 1px solid #222; transition: 0.4s; }
        .cartao-produto:hover { border-color: var(--dourado-luxo); transform: translateY(-5px); }
        .imagem-produto { width: 100%; height: 250px; object-fit: cover; }
        .info-produto { padding: 15px; text-align: center; }
        .preco-produto { color: var(--dourado-luxo); font-weight: bold; }

        /* BLOG (Resumo) */
        .secao-blog { margin-top: 60px; padding: 40px 5%; background: #0d0d0d; }
        .grade-blog { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .item-blog { padding: 20px; background: var(--preto-card); border-left: 3px solid var(--dourado-luxo); }
        .item-blog h3 { color: #F5D97A; margin-bottom: 10px; }

        /* WHATSAPP */
        .btn-whatsapp { 
            position: fixed; bottom: 30px; right: 30px; background: var(--cor-whatsapp); 
            width: 60px; height: 60px; border-radius: 50%; display: flex; 
            justify-content: center; align-items: center; z-index: 4000;
        }

        /* RESPONSIVO */
        @media (min-width: 768px) {
            .grade-produtos { grid-template-columns: repeat(4, 1fr); }
            .grade-blog { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <div class="promo-bar">ARKA ELEGANCY | ENVIOS EM MOÇAMBIQUE</div>

    <header>
        <div class="logo">Arka Elegancy</div>
    </header>

    <div class="container">
        <h2 class="titulo-secao">Coleção de Luxo</h2>
        <div class="grade-produtos">
            <!-- Exemplo de Produto (Repetir 10x conforme estruturado acima) -->
            <div class="cartao-produto">
                <img src="https://unsplash.com" class="imagem-produto">
                <div class="info-produto"><p>Vestido Silk Noir</p><p class="preco-produto">4.500 MT</p></div>
            </div>
            <!-- Adicionar mais cartões aqui -->
        </div>
    </div>

    <div class="secao-blog">
        <h2 class="titulo-secao">Conselhos de Estilo</h2>
        <div class="grade-blog">
            <!-- Exemplo de Artigo (Repetir 10x) -->
            <div class="item-blog"><h3>O Poder do Preto e Dourado</h3><p>Sofisticação eterna.</p></div>
            <!-- Adicionar mais artigos aqui -->
        </div>
    </div>

    <a href="#" class="btn-whatsapp">WP</a>
    <script>
        /* =========================================================
   PARTE 2: LÓGICA E COMPORTAMENTO (JAVASCRIPT)
   Projeto: Arka Elegancy
   Funcionalidades: Zoom de Produto (Lupa) e Vendas via WhatsApp
   ========================================================= */

/**
 * Função para ativar a visualização de detalhes (Lupa)
 * @param {string} imgUrl - URL da imagem do produto
 * @param {string} nome - Nome do produto para identificação
 */
function abrirLupa(imgUrl, nome) {
    const modal = document.getElementById('zoomModal');
    const viewer = document.getElementById('zoomViewer');
    
    if (modal && viewer) {
        modal.style.display = "flex";
        viewer.style.backgroundImage = `url('${imgUrl}')`;
        console.log("Arka Elegancy - Inspecionando: " + nome);
    }

    /**
     * Lógica de Zoom para Desktop (Movimento do Rato)
     * Ajusta a posição do fundo da imagem com base nas coordenadas do cursor
     */
    viewer.onmousemove = function(e) {
        const x = (e.offsetX / viewer.offsetWidth) * 100;
        const y = (e.offsetY / viewer.offsetHeight) * 100;
        viewer.style.backgroundPosition = `${x}% ${y}%`;
    };

    /**
     * Suporte para Dispositivos Móveis (Touch)
     * Garante que o efeito de lupa funcione ao deslizar o dedo em telemóveis
     */
    viewer.ontouchmove = function(e) {
        e.preventDefault(); // Evita o scroll lateral durante o zoom
        const touch = e.touches;
        const rect = viewer.getBoundingClientRect();
        const x = ((touch.clientX - rect.left) / rect.width) * 100;
        const y = ((touch.clientY - rect.top) / rect.height) * 100;
        viewer.style.backgroundPosition = `${x}% ${y}%`;
    };
}

/**
 * Função para encerrar o modo de zoom
 */
function fecharLupa() {
    const modal = document.getElementById('zoomModal');
    if (modal) {
        modal.style.display = "none";
    }
}

/**
 * Eventos Globais: Fecha ao clicar fora ou pressionar 'Escape'
 */
window.onclick = function(event) {
    const modal = document.getElementById('zoomModal');
    if (event.target == modal) fecharLupa();
};

document.addEventListener('keydown', function(e) {
    if (e.key === "Escape") fecharLupa();
});

// Mensagem de Inicialização para a Reivenstudio
console.log("Arka Elegancy: Sistema de interatividade luxo carregado.");
</script>

</body>
</html>
