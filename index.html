<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arka Elegancy | Sofisticação e Estilo</title>
    <style>
        :root {
            --preto-fundo: #0a0a0a;
            --preto-card: #141414;
            --dourado: #D4AF37;
            --dourado-brilho: #F5D97A;
            --branco: #ffffff;
            --wa-verde: #25d366;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Playfair Display', serif, Arial; }
        body { background-color: var(--preto-fundo); color: var(--branco); line-height: 1.6; overflow-x: hidden; }

        /* CABEÇALHO */
        .promo-bar { background: var(--dourado); color: #000; text-align: center; padding: 8px; font-size: 11px; font-weight: bold; letter-spacing: 1px; }
        header { background: rgba(20, 20, 20, 0.95); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--dourado); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        
        .logo { 
            font-size: 26px; font-weight: 900; text-transform: uppercase; letter-spacing: 3px;
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* VITRINE DE PRODUTOS (10 ITENS) */
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .section-header { text-align: center; margin: 50px 0 30px; }
        .section-header h2 { text-transform: uppercase; color: var(--dourado); letter-spacing: 4px; font-size: 28px; }
        
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .product-card { background: var(--preto-card); border: 1px solid #222; border-radius: 5px; overflow: hidden; cursor: pointer; transition: 0.4s; }
        .product-card:hover { border-color: var(--dourado); transform: translateY(-5px); }
        .product-img { width: 100%; height: 260px; object-fit: cover; border-bottom: 1px solid var(--dourado); }
        .product-info { padding: 15px; text-align: center; }
        .product-price { color: var(--dourado); font-weight: bold; font-size: 18px; margin-top: 5px; }

        /* BLOG (10 ARTIGOS) */
        .blog-section { margin-top: 60px; padding: 50px 5%; background: #0f0f0f; border-top: 1px solid #1a1a1a; }
        .blog-grid { display: grid; grid-template-columns: 1fr; gap: 25px; }
        .blog-item { padding: 25px; background: var(--preto-card); border-left: 4px solid var(--dourado); }
        .blog-item h3 { color: var(--dourado-brilho); margin-bottom: 12px; font-size: 18px; text-transform: uppercase; }
        .blog-item p { color: #aaa; font-size: 14px; }

        /* MODAL LUPA / ZOOM */
        .zoom-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 3000; justify-content: center; align-items: center; }
        .zoom-box { width: 90%; max-width: 550px; background: #111; padding: 15px; border: 1px solid var(--dourado); position: relative; }
        .zoom-viewer { width: 100%; height: 480px; background-size: 250%; background-repeat: no-repeat; background-position: center; cursor: crosshair; }
        .close-zoom { position: absolute; top: -50px; right: 0; color: var(--dourado); font-size: 45px; cursor: pointer; }

        /* WHATSAPP FLUTUANTE */
        .btn-whatsapp { 
            position: fixed; bottom: 30px; right: 30px; background: var(--wa-verde); color: white; 
            width: 65px; height: 65px; border-radius: 50%; display: flex; justify-content: center; 
            align-items: center; font-size: 32px; z-index: 4000; text-decoration: none; 
            box-shadow: 0 0 20px rgba(37, 211, 102, 0.5); border: 2px solid var(--dourado);
        }

        @media (min-width: 768px) {
            .product-grid { grid-template-columns: repeat(4, 1fr); }
            .blog-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="promo-bar">ARKA ELEGANCY | ENVIOS EM MOÇAMBIQUE - PAGAMENTO EM METICAIS</div>
    <header><div class="logo">Arka Elegancy</div></header>

    <div class="container">
        <div class="section-header"><h2>Coleção de Luxo</h2></div>
        <div class="product-grid">
            <!-- 10 PRODUTOS (Exemplos) -->
            <div class="product-card" onclick="abrirLupa('https://unsplash.com', 'Vestido Silk Noir')">
                <img src="https://unsplash.com" class="product-img"><div class="product-info"><p>Vestido Silk Noir</p><p class="product-price">4.500 MT</p></div>
            </div>
            <!-- Repita a estrutura para os outros 9 produtos -->
        </div>
    </div>

    <div class="blog-section">
        <div class="section-header"><h2>Conselhos de Estilo</h2></div>
        <div class="blog-grid">
            <div class="blog-item"><h3>1. O Poder do Preto e Dourado</h3><p>Tendências 2026 em Moçambique focadas em sofisticação eterna.</p></div>
            <!-- Repita a estrutura para os outros 9 artigos -->
        </div>
    </div>

    <a href="https://wa.me" class="btn-whatsapp" target="_blank">WP</a>
    <div id="zoomModal" class="zoom-modal" onclick="fecharLupa()">
        <div class="zoom-box" onclick="event.stopPropagation()">
            <span class="close-zoom" onclick="fecharLupa()">&times;</span>
            <div id="zoomViewer" class="zoom-viewer"></div>
        </div>
    </div>

    <script>
        WP×
        function abrirLupa(imgUrl, nome) {
            const modal = document.getElementById('zoomModal');
            const viewer = document.getElementById('zoomViewer');
            if (modal && viewer) {
                modal.style.display = "flex";
                viewer.style.backgroundImage = `url('${imgUrl}')`;
            }

            viewer.onmousemove = function(e) {
                const x = (e.offsetX / viewer.offsetWidth) * 100;
                const y = (e.offsetY / viewer.offsetHeight) * 100;
                viewer.style.backgroundPosition = `${x}% ${y}%`;
            };

            viewer.ontouchmove = function(e) {
                e.preventDefault();
                const touch = e.touches;
                const rect = viewer.getBoundingClientRect();
                const x = ((touch.clientX - rect.left) / rect.width) * 100;
                const y = ((touch.clientY - rect.top) / rect.height) * 100;
                viewer.style.backgroundPosition = `${x}% ${y}%`;
            };
        }

        function fecharLupa() {
            document.getElementById('zoomModal').style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target == document.getElementById('zoomModal')) fecharLupa();
        };

        document.addEventListener('keydown', (e) => {
            if (e.key === "Escape") fecharLupa();
        });
    </script>
</body>
</html>
